<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#10110f" />
  <meta name="description" content="Cholos in Paris — tu espacio para crear, organizar y publicar música." />
  <title>Cholos in Paris — Studio</title>
  <link rel="icon" href="./assets/cholos-logo.png" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><img src="./assets/cholos-logo.png" alt="Cholos in Paris" /><span>CHIP<span class="brand-dot">.</span></span></div>
      <div class="workspace-label">TU ESPACIO</div>
      <nav class="main-nav" aria-label="Navegación principal">
        <button class="nav-item active" data-view="catalog"><span class="nav-icon">▤</span><span>Catálogo</span><kbd>01</kbd></button>
        <button class="nav-item" data-view="projects"><span class="nav-icon">◫</span><span>Proyectos</span><kbd>02</kbd></button>
        <button class="nav-item" data-view="spotify"><span class="nav-icon">◉</span><span>Spotify</span><kbd>03</kbd></button>
        <button class="nav-item" data-view="apps"><span class="nav-icon">▦</span><span>Otras apps</span><kbd>04</kbd></button>
      </nav>
      <div class="sidebar-bottom"><button class="nav-item" data-view="profile"><span class="nav-icon">○</span><span>Perfil y cuenta</span></button><div class="mini-profile" id="mini-profile"><div class="avatar avatar-sm" id="side-avatar">C</div><div><strong id="side-name">Cholos in Paris</strong><small>Espacio de artista</small></div><button class="dots" id="account-menu" aria-label="Opciones de cuenta">···</button></div></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button class="mobile-menu" id="mobile-menu" aria-label="Abrir menú">☰</button><div class="crumb"><span>CHIP STUDIO</span><i>/</i><b id="crumb-current">Catálogo</b></div><div class="top-actions"><span class="cloud-state"><i></i><span id="save-state">Guardado localmente</span></span><button class="icon-button" id="theme-toggle" aria-label="Cambiar tema">◐</button><button class="avatar avatar-sm avatar-button" data-view="profile" id="top-avatar">C</button></div></header>
      <div id="view-root" class="view-root"></div>
    </main>
    <section class="player-bar" id="player-bar"><div class="now-playing"><img id="player-cover" src="./assets/default-cover.jpg" alt="" /><div><strong id="player-title">Elige una canción</strong><small id="player-artist">Tu música aparecerá aquí</small></div><button class="heart" aria-label="Me gusta">♡</button></div><div class="playback"><div class="play-controls"><button aria-label="Anterior" id="prev-track">|◀</button><button class="play-main" id="play-toggle" aria-label="Reproducir">▶</button><button aria-label="Siguiente" id="next-track">▶|</button></div><div class="progress-row"><span id="elapsed">0:00</span><input type="range" id="seek" min="0" max="100" value="0" aria-label="Progreso de reproducción" /><span id="total-time">0:00</span></div></div><div class="player-tools"><button id="lyrics-open">☷ <span>Letra</span></button><button id="queue-open">☷ <span>Cola</span></button><button aria-label="Volumen">◖<input type="range" min="0" max="100" value="72" aria-label="Volumen" /></button><button class="expand-player" id="expand-player" aria-label="Abrir reproductor">↗</button></div></section>
    <div id="modal-root"></div><div id="toast-root" class="toast-root" aria-live="polite"></div>
  </div>
</body>
</html>
